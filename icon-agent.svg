<svg width="250" height="250" viewBox="0 0 250 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="bodySilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.8)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>
    <radialGradient id="eyeData" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
  </defs>

  <style>
    @keyframes floatAgent {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); filter: drop-shadow(0 20px 15px rgba(56,189,248,0.4)); }
    }
    .cpu-unit {
      transform-origin: 125px 125px;
      animation: floatAgent 4s infinite ease-in-out;
      filter: drop-shadow(0 10px 10px rgba(56,189,248,0.2));
    }
    
    @keyframes scanEye {
      0% { r: 10; opacity: 1; }
      50% { r: 25; opacity: 0.5; stroke-width: 5; }
      100% { r: 40; opacity: 0; stroke-width: 1; }
    }
    .radar { animation: scanEye 2s infinite cubic-bezier(0.1, 0.5, 0.9, 1); fill: none; stroke: #38bdf8; }
    
    @keyframes textBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .txt-glow { animation: textBlink 1s infinite; }
  </style>

  <!-- Ambient rotating data matrix background -->
  <g opacity="0.3">
    <circle cx="125" cy="125" r="100" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 10">
      <animateTransform attributeName="transform" type="rotate" from="0 125 125" to="-360 125 125" dur="20s" repeatCount="indefinite" />
    </circle>
    <circle cx="125" cy="125" r="115" fill="none" stroke="#c084fc" stroke-width="1" stroke-dasharray="10 30">
      <animateTransform attributeName="transform" type="rotate" from="0 125 125" to="360 125 125" dur="15s" repeatCount="indefinite" />
    </circle>
  </g>

  <g class="cpu-unit">
    <!-- CPU Gold Pins Left/Right/Top/Bottom -->
    <path d="M 60 90 L 40 90 M 60 110 L 40 110 M 60 130 L 40 130 M 60 150 L 40 150" stroke="#f59e0b" stroke-width="4"/>
    <path d="M 190 90 L 210 90 M 190 110 L 210 110 M 190 130 L 210 130 M 190 150 L 210 150" stroke="#f59e0b" stroke-width="4"/>
    <path d="M 90 60 L 90 40 M 110 60 L 110 40 M 130 60 L 130 40 M 150 60 L 150 40" stroke="#f59e0b" stroke-width="4"/>
    <path d="M 90 190 L 90 210 M 110 190 L 110 210 M 130 190 L 130 210 M 150 190 L 150 210" stroke="#f59e0b" stroke-width="4"/>
    
    <!-- Metallic Shell -->
    <rect x="60" y="60" width="130" height="130" rx="15" fill="url(#bodySilver)" stroke="#0f172a" stroke-width="2" />
    <!-- Glass/Gloss reflection on shell -->
    <rect x="60" y="60" width="130" height="65" rx="15" fill="url(#highlight)" />
    
    <!-- Inner Dark Silicon Core -->
    <rect x="75" y="75" width="100" height="100" rx="8" fill="#020617" stroke="#334155" stroke-width="2" />
    <path d="M 75 75 L 175 175 M 175 75 L 75 175" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

    <!-- Glowing Cyber Eye in Center -->
    <circle cx="125" cy="125" r="25" fill="url(#eyeData)" filter="url(#glow)"/>
    <circle cx="125" cy="125" r="10" fill="#fff" />
    <circle cx="125" cy="125" class="radar"/>
    <circle cx="125" cy="125" class="radar" style="animation-delay: 1s;" />
    
    <!-- Nano text etched on CPU -->
    <text x="125" y="195" font-family="'Courier New', monospace" font-size="10" fill="#94a3b8" text-anchor="middle" letter-spacing="2">AI_CORE_V9</text>
  </g>
  
  <text x="125" y="30" font-family="'Courier New', monospace" font-size="12" fill="#38bdf8" text-anchor="middle" class="txt-glow">[ OVERWATCH ACTIVE ]</text>
</svg>
