<svg width="250" height="250" viewBox="0 0 250 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>
    <radialGradient id="ai-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="rgba(56,189,248,0)" />
    </radialGradient>
  </defs>

  <style>
    @keyframes spinFloat {
      0% { transform: translateY(0px) rotateX(60deg) rotateZ(0deg); }
      50% { transform: translateY(-15px) rotateX(65deg) rotateZ(180deg); }
      100% { transform: translateY(0px) rotateX(60deg) rotateZ(360deg); }
    }
    .ring {
      transform-origin: 125px 125px;
      animation: spinFloat 10s infinite linear;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(1); filter: drop-shadow(0 0 10px #38bdf8); }
      50% { opacity: 1; transform: scale(1.1); filter: drop-shadow(0 0 30px #38bdf8); }
    }
    .core {
      transform-origin: 125px 125px;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes traceFire {
      0% { stroke-dashoffset: 100; opacity: 1;}
      100% { stroke-dashoffset: -100; opacity: 0;}
    }
    .circuit {
      stroke-dasharray: 10 90;
      animation: traceFire 2s infinite linear;
    }
    .circuit-reverse {
      stroke-dasharray: 10 90;
      animation: traceFire 2.5s infinite linear reverse;
    }
    
    @keyframes bounceChart {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .bar { transform-origin: bottom; }
  </style>

  <!-- Deep Background Particles -->
  <g opacity="0.5">
    <circle cx="50" cy="50" r="2" fill="#38bdf8"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" /></circle>
    <circle cx="200" cy="200" r="2" fill="#c084fc"><animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite" /></circle>
    <circle cx="210" cy="60" r="3" fill="#ec4899"><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" /></circle>
  </g>

  <!-- 3D Holographic Base Rings -->
  <g class="ring">
    <circle cx="125" cy="125" r="90" fill="none" stroke="url(#metal)" stroke-width="6" opacity="0.8" />
    <circle cx="125" cy="125" r="70" fill="none" stroke="rgba(56,189,248,0.5)" stroke-width="2" stroke-dasharray="10 15" />
    <circle cx="125" cy="125" r="100" fill="none" stroke="rgba(192,132,252,0.3)" stroke-width="1" stroke-dasharray="2 8" />
  </g>

  <!-- Circuit traces connecting to center -->
  <path d="M 125 125 L 30 125" stroke="#38bdf8" stroke-width="2" class="circuit" filter="url(#glow)"/>
  <path d="M 125 125 L 220 125" stroke="#ec4899" stroke-width="2" class="circuit-reverse" filter="url(#glow)"/>
  <path d="M 125 125 L 125 30" stroke="#a855f7" stroke-width="2" class="circuit" filter="url(#glow)"/>
  <path d="M 125 125 L 125 220" stroke="#38bdf8" stroke-width="2" class="circuit-reverse" filter="url(#glow)"/>
  
  <path d="M 125 125 L 58 58" stroke="#38bdf8" stroke-width="2" class="circuit-reverse" filter="url(#glow)"/>
  <path d="M 125 125 L 192 192" stroke="#c084fc" stroke-width="2" class="circuit" filter="url(#glow)"/>

  <!-- Financial AI Core -->
  <circle cx="125" cy="125" r="35" fill="none" stroke="url(#glass)" stroke-width="4" filter="url(#superGlow)"/>
  <circle cx="125" cy="125" r="30" fill="url(#ai-core)" class="core" />
  
  <!-- Holographic Candlestick Graph emerging from the core -->
  <g transform="translate(90, 100)" filter="url(#glow)">
    <!-- Candlestick 1 -->
    <g class="bar">
      <line x1="10" y1="20" x2="10" y2="40" stroke="#ec4899" stroke-width="2"/>
      <rect x="5" y="25" width="10" height="10" fill="#ec4899" rx="2">
         <animate attributeName="y" values="25;15;25" dur="2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- Candlestick 2 -->
    <g class="bar">
      <line x1="35" y1="10" x2="35" y2="35" stroke="#38bdf8" stroke-width="2"/>
      <rect x="30" y="15" width="10" height="15" fill="#38bdf8" rx="2">
        <animate attributeName="y" values="15;5;15" dur="1.5s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- Candlestick 3 -->
    <g class="bar">
      <line x1="60" y1="0" x2="60" y2="45" stroke="#a855f7" stroke-width="2"/>
      <rect x="55" y="10" width="10" height="20" fill="#a855f7" rx="2">
        <animate attributeName="height" values="20;30;20" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="10;0;10" dur="3s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  <path d="M 80 140 Q 100 120 125 110 T 170 80" fill="none" stroke="#fff" stroke-width="3" filter="url(#glow)" stroke-dasharray="150" stroke-dashoffset="150">
    <animate attributeName="stroke-dashoffset" values="150;0" dur="2s" fill="freeze" repeatCount="indefinite"/>
  </path>
</svg>
