<svg width="250" height="250" viewBox="0 0 250 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="hyperGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="serverRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseData {
      0% { stroke-dashoffset: 100; opacity: 1; }
      100% { stroke-dashoffset: -100; opacity: 0; }
    }
    .data-flow {
      stroke-dasharray: 20 80;
      animation: pulseData 1.5s infinite linear;
    }
    .data-flow-rev {
      stroke-dasharray: 10 90;
      animation: pulseData 2s infinite linear reverse;
    }
    
    @keyframes spinNet {
      0% { transform: rotateX(70deg) rotateZ(0deg); }
      100% { transform: rotateX(70deg) rotateZ(360deg); }
    }
    .net-ring { transform-origin: 125px 100px; animation: spinNet 12s infinite linear; }
    
    @keyframes blinkLed { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    .led1 { animation: blinkLed 0.5s infinite; }
    .led2 { animation: blinkLed 0.8s infinite; }
    .led3 { animation: blinkLed 1.2s infinite; }
  </style>

  <!-- Orbital Data Network Rings -->
  <g class="net-ring">
    <circle cx="125" cy="100" r="110" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.3"/>
    <circle cx="125" cy="100" r="110" fill="none" stroke="#c084fc" stroke-width="4" stroke-dasharray="10 40" filter="url(#glow)"/>
    <circle cx="125" cy="100" r="90" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 20" filter="url(#glow)"/>
  </g>

  <!-- Fiber Optic Cables connecting Servers -->
  <path d="M 60 170 C 90 220 160 220 190 170" fill="none" stroke="#38bdf8" stroke-width="4" filter="url(#glow)" opacity="0.4"/>
  <path d="M 60 170 C 90 220 160 220 190 170" fill="none" stroke="#fff" stroke-width="2" class="data-flow" filter="url(#glow)"/>
  
  <path d="M 125 70 C 180 30 220 100 190 170" fill="none" stroke="#c084fc" stroke-width="3" filter="url(#glow)" opacity="0.4"/>
  <path d="M 125 70 C 180 30 220 100 190 170" fill="none" stroke="#fff" stroke-width="2" class="data-flow-rev" filter="url(#glow)"/>
  
  <path d="M 125 70 C 70 30 30 100 60 170" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" opacity="0.4"/>
  <path d="M 125 70 C 70 30 30 100 60 170" fill="none" stroke="#fff" stroke-width="2" class="data-flow" filter="url(#glow)"/>

  <!-- 3D Realistic Server Racks -->
  
  <!-- Server 1 (Left) -->
  <g transform="translate(20, 140) rotate(-15)">
    <rect x="0" y="0" width="50" height="70" rx="5" fill="url(#serverGrad)" stroke="url(#serverRim)" stroke-width="2" />
    <rect x="5" y="10" width="40" height="10" rx="2" fill="#0f172a" />
    <circle cx="15" cy="15" r="2" fill="#10b981" class="led1" filter="url(#glow)"/>
    <circle cx="25" cy="15" r="2" fill="#10b981" class="led2" />
    
    <rect x="5" y="30" width="40" height="10" rx="2" fill="#0f172a" />
    <circle cx="15" cy="35" r="2" fill="#38bdf8" class="led3" filter="url(#glow)"/>
    
    <rect x="5" y="50" width="40" height="10" rx="2" fill="#0f172a" />
    <circle cx="15" cy="55" r="2" fill="#ef4444" class="led1" />
  </g>

  <!-- Server 2 (Right) -->
  <g transform="translate(180, 140) rotate(15)">
    <rect x="0" y="0" width="50" height="70" rx="5" fill="url(#serverGrad)" stroke="url(#serverRim)" stroke-width="2" />
    <rect x="5" y="10" width="40" height="10" rx="2" fill="#0f172a" />
    <circle cx="15" cy="15" r="2" fill="#c084fc" class="led2" filter="url(#glow)"/>
    
    <rect x="5" y="30" width="40" height="10" rx="2" fill="#0f172a" />
    <circle cx="15" cy="35" r="2" fill="#10b981" class="led1" />
    <circle cx="25" cy="35" r="2" fill="#10b981" class="led3" filter="url(#glow)"/>
    
    <rect x="5" y="50" width="40" height="10" rx="2" fill="#0f172a" />
    <circle cx="15" cy="55" r="2" fill="#10b981" class="led2" />
  </g>

  <!-- Server 3 (Top Master Node) -->
  <g transform="translate(100, 30)">
    <rect x="0" y="0" width="50" height="70" rx="5" fill="url(#serverGrad)" stroke="url(#serverRim)" stroke-width="2" filter="url(#hyperGlow)"/>
    <rect x="0" y="0" width="50" height="70" rx="5" fill="url(#serverGrad)" stroke="url(#serverRim)" stroke-width="2" />
    
    <rect x="5" y="10" width="40" height="30" rx="2" fill="#0f172a" />
    <!-- Master Hologram emitted from front -->
    <path d="M 25 25 L 10 40 L 40 40 Z" fill="#38bdf8" filter="url(#glow)" opacity="0.8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
    <rect x="5" y="50" width="40" height="10" rx="2" fill="#0f172a" />
    <circle cx="15" cy="55" r="2" fill="#10b981" class="led1" filter="url(#glow)"/>
    <circle cx="25" cy="55" r="2" fill="#38bdf8" class="led2" filter="url(#glow)"/>
    <circle cx="35" cy="55" r="2" fill="#c084fc" class="led3" filter="url(#glow)"/>
  </g>
</svg>
