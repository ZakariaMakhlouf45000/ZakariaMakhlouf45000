<svg width="250" height="250" viewBox="0 0 250 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadowLego"><feGaussianBlur stdDeviation="4" result="blur"/><feOffset dy="15" dx="0"/><feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    
    <!-- Hyper-realistic LEGO block face gradients for lighting/shadows -->
    <linearGradient id="legoTopC" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7dd3fc" /><stop offset="100%" stop-color="#38bdf8" /></linearGradient>
    <linearGradient id="legoLeftC" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0284c7" /><stop offset="100%" stop-color="#0369a1" /></linearGradient>
    <linearGradient id="legoRightC" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#0ea5e9" /><stop offset="100%" stop-color="#0284c7" /></linearGradient>
    
    <linearGradient id="legoTopV" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#d8b4fe" /><stop offset="100%" stop-color="#c084fc" /></linearGradient>
    <linearGradient id="legoLeftV" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#9333ea" /><stop offset="100%" stop-color="#7e22ce" /></linearGradient>
    <linearGradient id="legoRightV" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#a855f7" /><stop offset="100%" stop-color="#9333ea" /></linearGradient>
  </defs>

  <style>
    @keyframes dropAssm1 {
      0%, 100% { transform: translateY(0) scale(1); filter: url(#shadowLego); }
      50% { transform: translateY(-5px) scale(1.02); filter: url(#shadowLego); }
    }
    @keyframes dropAssm2 {
      0%, 8% { transform: translateY(-150px) scale(0.8) rotateX(-20deg); opacity: 0; }
      15% { transform: translateY(0) scale(1) rotateX(0deg); opacity: 1; }
      85% { transform: translateY(0) scale(1) rotateX(0deg); opacity: 1; filter: drop-shadow(0 0 15px #c084fc); }
      92%, 100% { transform: translateY(-150px) scale(0.8) rotateX(20deg); opacity: 0; }
    }
    @keyframes dropAssm3 {
      0%, 15% { transform: translateY(-200px) scale(0.7) rotateY(30deg); opacity: 0; }
      22% { transform: translateY(0) scale(1); opacity: 1; filter: drop-shadow(0 0 20px #38bdf8); }
      75% { transform: translateY(0) scale(1); opacity: 1; }
      85%, 100% { transform: translateY(-200px) scale(0.7) rotateY(-30deg); opacity: 0; }
    }
    .blk1 { animation: dropAssm1 8s infinite cubic-bezier(0.4, 0, 0.2, 1); }
    .blk2 { animation: dropAssm2 8s infinite cubic-bezier(0.4, 0, 0.2, 1); }
    .blk3 { animation: dropAssm3 8s infinite cubic-bezier(0.4, 0, 0.2, 1); }
    .scene-wrap { animation: sceneBob 4s infinite ease-in-out; transform-origin: 125px 125px;}
    @keyframes sceneBob {
      0%, 100% { transform: translateY(5px); }
      50% { transform: translateY(-5px); }
    }
  </style>

  <!-- Futuristic building platform grid -->
  <g transform="translate(125, 210) scale(1.8)" opacity="0.3">
    <polygon points="0,0 60,-30 0,-60 -60,-30" fill="none" stroke="#c084fc" stroke-width="1.5" filter="url(#glow)"/>
    <polygon points="0,-10 50,-35 0,-60 -50,-35" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <!-- Glowing core in center of pad -->
    <circle cx="0" cy="-30" r="10" fill="#c084fc" filter="url(#glow)">
       <animate attributeName="r" values="5;15;5" dur="2s" repeatCount="indefinite" />
       <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <g class="scene-wrap">
    <!-- BLK 1 -->
    <g class="blk1" transform="translate(125, 200)">
      <polygon points="0,0 60,-30 60,-55 0,-25" fill="url(#legoRightC)" />
      <polygon points="0,0 -60,-30 -60,-55 0,-25" fill="url(#legoLeftC)" />
      <polygon points="0,-25 60,-55 0,-85 -60,-55" fill="url(#legoTopC)" />
      <!-- Photoreal Studs -->
      <g transform="translate(0, -45)">
        <path d="M -10,0 L -10,-8 A 10 5 0 0 0 10,-8 L 10,0 A 10 5 0 0 1 -10,0 Z" fill="url(#legoLeftC)" />
        <ellipse cx="0" cy="-8" rx="10" ry="5" fill="url(#legoTopC)" />
      </g>
      <g transform="translate(-30, -60)">
        <path d="M -10,0 L -10,-8 A 10 5 0 0 0 10,-8 L 10,0 A 10 5 0 0 1 -10,0 Z" fill="url(#legoLeftC)" />
        <ellipse cx="0" cy="-8" rx="10" ry="5" fill="url(#legoTopC)" />
      </g>
      <g transform="translate(30, -60)">
        <path d="M -10,0 L -10,-8 A 10 5 0 0 0 10,-8 L 10,0 A 10 5 0 0 1 -10,0 Z" fill="url(#legoLeftC)" />
        <ellipse cx="0" cy="-8" rx="10" ry="5" fill="url(#legoTopC)" />
      </g>
      <g transform="translate(0, -75)">
        <path d="M -10,0 L -10,-8 A 10 5 0 0 0 10,-8 L 10,0 A 10 5 0 0 1 -10,0 Z" fill="url(#legoLeftC)" />
        <ellipse cx="0" cy="-8" rx="10" ry="5" fill="url(#legoTopC)" />
      </g>
    </g>

    <!-- BLK 2 -->
    <g class="blk2" transform="translate(125, 155)">
      <polygon points="0,0 60,-30 60,-55 0,-25" fill="url(#legoRightV)" />
      <polygon points="0,0 -60,-30 -60,-55 0,-25" fill="url(#legoLeftV)" />
      <polygon points="0,-25 60,-55 0,-85 -60,-55" fill="url(#legoTopV)" />
      
      <g transform="translate(0, -45)">
        <path d="M -10,0 L -10,-8 A 10 5 0 0 0 10,-8 L 10,0 A 10 5 0 0 1 -10,0 Z" fill="url(#legoLeftV)" />
        <ellipse cx="0" cy="-8" rx="10" ry="5" fill="url(#legoTopV)" />
      </g>
      <g transform="translate(-30, -60)">
        <path d="M -10,0 L -10,-8 A 10 5 0 0 0 10,-8 L 10,0 A 10 5 0 0 1 -10,0 Z" fill="url(#legoLeftV)" />
        <ellipse cx="0" cy="-8" rx="10" ry="5" fill="url(#legoTopV)" />
      </g>
      <g transform="translate(30, -60)">
        <path d="M -10,0 L -10,-8 A 10 5 0 0 0 10,-8 L 10,0 A 10 5 0 0 1 -10,0 Z" fill="url(#legoLeftV)" />
        <ellipse cx="0" cy="-8" rx="10" ry="5" fill="url(#legoTopV)" />
      </g>
      <g transform="translate(0, -75)">
        <path d="M -10,0 L -10,-8 A 10 5 0 0 0 10,-8 L 10,0 A 10 5 0 0 1 -10,0 Z" fill="url(#legoLeftV)" />
        <ellipse cx="0" cy="-8" rx="10" ry="5" fill="url(#legoTopV)" />
      </g>
    </g>

    <!-- BLK 3 Hologram / Energy Block -->
    <g class="blk3" transform="translate(125, 110)">
      <!-- This block is made of pure light/glass -->
      <polygon points="0,0 60,-30 60,-55 0,-25" fill="rgba(56,189,248,0.7)" stroke="#fff" stroke-width="1.5" />
      <polygon points="0,0 -60,-30 -60,-55 0,-25" fill="rgba(2,132,199,0.8)" stroke="#fff" stroke-width="1.5" />
      <polygon points="0,-25 60,-55 0,-85 -60,-55" fill="rgba(125,211,252,0.9)" stroke="#fff" stroke-width="1.5" />
      
      <!-- Energy inner pulse -->
      <polygon points="0,-25 40,-45 0,-65 -40,-45" fill="#fff" filter="url(#glow)">
        <animate attributeName="opacity" values="0.1;1;0.1" dur="1s" repeatCount="indefinite" />
      </polygon>

      <g transform="translate(0, -45)">
        <path d="M -10,0 L -10,-8 A 10 5 0 0 0 10,-8 L 10,0 A 10 5 0 0 1 -10,0 Z" fill="rgba(2,132,199,0.8)" stroke="#fff" stroke-width="0.5"/>
        <ellipse cx="0" cy="-8" rx="10" ry="5" fill="#fff" filter="url(#glow)"/>
      </g>
      <g transform="translate(-30, -60)">
        <path d="M -10,0 L -10,-8 A 10 5 0 0 0 10,-8 L 10,0 A 10 5 0 0 1 -10,0 Z" fill="rgba(2,132,199,0.8)" stroke="#fff" stroke-width="0.5"/>
        <ellipse cx="0" cy="-8" rx="10" ry="5" fill="#fff" filter="url(#glow)"/>
      </g>
      <g transform="translate(30, -60)">
        <path d="M -10,0 L -10,-8 A 10 5 0 0 0 10,-8 L 10,0 A 10 5 0 0 1 -10,0 Z" fill="rgba(2,132,199,0.8)" stroke="#fff" stroke-width="0.5"/>
        <ellipse cx="0" cy="-8" rx="10" ry="5" fill="#fff" filter="url(#glow)"/>
      </g>
      <g transform="translate(0, -75)">
        <path d="M -10,0 L -10,-8 A 10 5 0 0 0 10,-8 L 10,0 A 10 5 0 0 1 -10,0 Z" fill="rgba(2,132,199,0.8)" stroke="#fff" stroke-width="0.5"/>
        <ellipse cx="0" cy="-8" rx="10" ry="5" fill="#fff" filter="url(#glow)"/>
      </g>
    </g>
  </g>
</svg>
