<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.8" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00f5ff" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    .orbit { animation: spin 20s linear infinite; transform-origin: 120px 120px; }
    .pulse-star { animation: pulse 3s ease-in-out infinite alternate; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes pulse { 0% { opacity: 0.3; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }
    .code-font { font-family: 'Fira Code', 'Courier New', monospace; }
    .ui-font { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  </style>

  <!-- Card Background -->
  <rect width="800" height="240" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" filter="url(#softShadow)" />

  <!-- Starfield decorative dots -->
  <g fill="#94a3b8" opacity="0.6">
    <circle cx="280" cy="40" r="1.5" class="pulse-star" />
    <circle cx="450" cy="30" r="1" />
    <circle cx="720" cy="60" r="1.5" class="pulse-star" />
    <circle cx="340" cy="200" r="1" />
    <circle cx="680" cy="190" r="2" class="pulse-star" />
    <circle cx="580" cy="50" r="1.5" />
    <circle cx="240" cy="160" r="1" />
  </g>

  <!-- Constellation grid lines -->
  <path d="M 280,40 L 320,80 L 450,30 M 580,50 L 680,80 L 720,60" fill="none" stroke="#334155" stroke-dasharray="3,3" stroke-width="1" />

  <!-- LEFT EMBLEM: Space & Code Fusion -->
  <g transform="translate(10, 0)">
    <!-- Outer Glow Aura -->
    <circle cx="120" cy="120" r="64" fill="url(#glowGrad)" opacity="0.15" filter="url(#neonGlow)" />
    
    <!-- Orbital Rings -->
    <ellipse cx="120" cy="120" rx="76" ry="28" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" transform="rotate(-25 120 120)" />
    <ellipse cx="120" cy="120" rx="76" ry="28" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.7" transform="rotate(35 120 120)" />
    
    <!-- Satellite / Particle on Orbit -->
    <circle cx="185" cy="90" r="3.5" fill="#38bdf8" filter="url(#neonGlow)" />

    <!-- Planet Core -->
    <circle cx="120" cy="120" r="48" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="2.5" />

    <!-- Code Symbol Inside Planet < / > -->
    <path d="M 104,106 L 90,120 L 104,134" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 136,106 L 150,120 L 136,134" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 125,102 L 115,138" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Vertical Separator Divider -->
  <line x1="225" y1="40" x2="225" y2="200" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- RIGHT TEXT CONTENT -->
  <!-- Institution Title -->
  <text x="255" y="75" class="ui-font" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="2">
    IUT D'ORLÉANS
  </text>

  <!-- Department & Speciality Badge -->
  <rect x="255" y="95" width="235" height="26" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
  <text x="267" y="113" class="code-font" font-size="13" font-weight="700" fill="#a5b4fc" letter-spacing="1">
    DÉPARTEMENT INFORMATIQUE
  </text>

  <!-- Degree / Domain Subtitle -->
  <text x="255" y="152" class="ui-font" font-size="16" font-weight="600" fill="url(#accentGrad)" letter-spacing="0.5">
    BUT Informatique • Architecture, IA &amp; Développement
  </text>

  <!-- Terminal Status Line -->
  <g transform="translate(255, 172)">
    <rect width="490" height="30" rx="6" fill="#030712" stroke="#1f2937" stroke-width="1" />
    <circle cx="15" cy="15" r="4" fill="#22c55e" />
    <text x="28" y="20" class="code-font" font-size="12" fill="#94a3b8">
      system:~$ init --mission "Exploring Algorithmic Galaxies"
    </text>
  </g>
</svg>
